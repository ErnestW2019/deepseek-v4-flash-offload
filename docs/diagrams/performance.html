<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsv4-plugin throughput</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    .caption {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      line-height: 1.6;
      color: var(--color-muted);
      margin-top: 1rem;
      letter-spacing: 0.02em;
    }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Performance · DSV4-Plugin</p>
    <h1>MXFP4 (a4w4) vs bf16: decode throughput</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="perf-title perf-desc">
        <title id="perf-title">Decode throughput, MXFP4 a4w4 versus bf16</title>
        <desc id="perf-desc">Grouped columns compare decode throughput in tokens per second for two workloads. Single stream at 512 context: bf16 4.23, a4w4 6.55. Serving 8 concurrent requests of 32 tokens: bf16 6.64, a4w4 19.47, a 2.9x speedup.</desc>

        <defs></defs>

        <!-- background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ y gridlines ============ -->
        <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="135" x2="960" y2="135" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="325" x2="960" y2="325" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

        <!-- ============ axes ============ -->
        <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

        <!-- y-axis labels -->
        <text x="72" y="44"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">20</text>
        <text x="72" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">15</text>
        <text x="72" y="234" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">10</text>
        <text x="72" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">5</text>
        <text x="72" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">0</text>

        <!-- y-axis title -->
        <text x="28" y="230" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em" transform="rotate(-90 28 230)">DECODE TOK/S</text>

        <!-- ============ bars (mask, then body) ============ -->

        <!-- Group 1 · Single stream @512 -->
        <!-- bf16 4.23 -->
        <rect x="220" y="340" width="72" height="80" fill="#f5f5f5"/>
        <rect x="220" y="340" width="72" height="80" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1"/>
        <text x="256" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">4.23</text>
        <!-- a4w4 6.55 -->
        <rect x="308" y="296" width="72" height="124" fill="#f5f5f5"/>
        <rect x="308" y="296" width="72" height="124" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
        <text x="344" y="288" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6.55</text>

        <!-- Group 2 · Serving 8×32 -->
        <!-- bf16 6.64 -->
        <rect x="660" y="294" width="72" height="126" fill="#f5f5f5"/>
        <rect x="660" y="294" width="72" height="126" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1"/>
        <text x="696" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">6.64</text>
        <!-- a4w4 19.47 (focal) -->
        <rect x="748" y="50" width="72" height="370" fill="#f5f5f5"/>
        <rect x="748" y="50" width="72" height="370" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
        <text x="784" y="42" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">19.47</text>

        <!-- ============ x-axis category labels ============ -->
        <text x="300" y="444" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Single stream · 512</text>
        <text x="740" y="444" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Serving · 8×32</text>

        <!-- ============ legend ============ -->
        <rect x="80" y="478" width="12" height="12" rx="2" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="1"/>
        <text x="100" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">a4w4 · MXFP4</text>

        <rect x="240" y="478" width="12" height="12" rx="2" fill="rgba(124,143,111,0.18)" stroke="#7c8f6f" stroke-width="1"/>
        <text x="260" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">bf16</text>

        <line x1="360" y1="482" x2="382" y2="482" stroke="#bf4520" stroke-width="1.2"/>
        <text x="392" y="488" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">2.9× SERVING SPEEDUP</text>
      </svg>
    </div>

    <p class="caption">Best single-stream result: a4w4 at 2048 context = 7.10 tok/s (slot hit-rate 0.81). bf16 at 512 = 4.23 tok/s. Source: DESIGN.md §9, Ascend 950PR 128 GB single card.</p>
  </div>
</body>
</html>
