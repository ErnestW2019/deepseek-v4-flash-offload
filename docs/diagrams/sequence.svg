<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="sequence-title sequence-desc">
        <title id="sequence-title">Single MoE layer forward pass with expert offloading</title>
        <desc id="sequence-desc">Sequence diagram: the vLLM runner calls forward on the offload MoE layer, which routes top-k experts and dispatches to the offload engine; the engine looks up the NPU slot cache and, on a miss, pulls packed-MXFP4 experts from the host bank over H2D before the accent-highlighted single npu_grouped_matmul call returns per-expert outputs and the runner receives hidden_states.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
        </defs>

        <!-- background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ fragment frame (drawn behind) ============ -->
        <rect x="460" y="256" width="400" height="136" rx="4"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- ============ lifelines ============ -->
        <line x1="120" y1="104" x2="120" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="300" y1="104" x2="300" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="104" x2="480" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="660" y1="104" x2="660" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="840" y1="104" x2="840" y2="552" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ messages (arrows) ============ -->
        <!-- M1 Runner -> MoE : forward -->
        <line x1="124" y1="140" x2="296" y2="140" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- M2 MoE -> Engine : dispatch -->
        <line x1="304" y1="172" x2="476" y2="172" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- M3 Engine -> NPU : lookup -->
        <line x1="484" y1="204" x2="836" y2="204" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- M4 NPU -> Engine : hit / miss -->
        <line x1="836" y1="236" x2="484" y2="236" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M5 Engine -> Host : fetch -->
        <line x1="484" y1="316" x2="656" y2="316" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- M6 Host -> Engine : packed weights -->
        <line x1="656" y1="348" x2="484" y2="348" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M7 Engine -> NPU : H2D -->
        <line x1="484" y1="380" x2="836" y2="380" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- M8 Engine -> NPU : grouped matmul (headline) -->
        <line x1="484" y1="424" x2="836" y2="424" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- M9 NPU -> Engine : per-expert outputs -->
        <line x1="836" y1="456" x2="484" y2="456" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M10 Engine -> MoE : routed outputs -->
        <line x1="476" y1="488" x2="304" y2="488" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M11 MoE -> Runner : hidden_states -->
        <line x1="296" y1="520" x2="124" y2="520" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- ============ activation bars ============ -->
        <rect x="116" y="136" width="8" height="392" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="296" y="136" width="8" height="392" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="168" width="8" height="332" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="656" y="312" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="836" y="200" width="8" height="300" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- ============ message labels (mask + text) ============ -->
        <rect x="146" y="120" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="210" y="131" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">forward(hidden_states)</text>

        <rect x="338" y="152" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="390" y="163" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">dispatch(indices)</text>

        <rect x="562" y="184" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="195" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">lookup(slot)</text>

        <rect x="736" y="216" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="770" y="227" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">hit / miss</text>

        <rect x="518" y="296" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="307" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">fetch(expert ids)</text>

        <rect x="522" y="328" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="339" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MXFP4 w + scales</text>

        <rect x="554" y="360" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="371" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">H2D 20-51 GB/s</text>

        <rect x="542" y="404" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="415" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">npu_grouped_matmul</text>

        <rect x="706" y="436" width="108" height="12" rx="2" fill="#f5f5f5"/>
        <text x="760" y="447" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">per-expert outputs</text>

        <rect x="346" y="468" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="390" y="479" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">routed outputs</text>

        <rect x="168" y="500" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="210" y="511" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">hidden_states</text>

        <!-- ============ fragment tab + guard ============ -->
        <rect x="460" y="256" width="44" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="482" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="472" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[cache miss]</text>

        <!-- ============ actor boxes ============ -->

        <!-- vLLM Runner (external) -->
        <rect x="44" y="48" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="44" y="48" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="52" y="54" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="72" y="63" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RUNNER</text>
        <text x="120" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">vLLM Runner</text>
        <text x="120" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scheduler</text>

        <!-- Offload MoE (backend) -->
        <rect x="224" y="48" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="224" y="48" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="232" y="54" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="246" y="63" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MOE</text>
        <text x="300" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Offload MoE</text>
        <text x="300" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gate / router</text>

        <!-- Offload Engine (focal) -->
        <rect x="404" y="48" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="404" y="48" width="152" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="412" y="54" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="432" y="63" fill="rgba(191,69,32,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
        <text x="480" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Offload Engine</text>
        <text x="480" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ExpertOffloadEngine</text>

        <!-- Host Bank (store) -->
        <rect x="584" y="48" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="584" y="48" width="152" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="592" y="54" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="608" y="63" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="660" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Host Bank</text>
        <text x="660" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">packed MXFP4</text>

        <!-- Slot Cache (backend) -->
        <rect x="764" y="48" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="764" y="48" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="772" y="54" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="790" y="63" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
        <text x="840" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Slot Cache</text>
        <text x="840" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NPU bf16 LRU</text>

        <!-- ============ legend (horizontal strip) ============ -->
        <line x1="40" y1="584" x2="920" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <line x1="120" y1="600" x2="154" y2="600" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="164" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CALL</text>

        <line x1="250" y1="600" x2="284" y2="600" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="294" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">RETURN</text>

        <line x1="400" y1="600" x2="434" y2="600" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="444" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">HEADLINE</text>

        <rect x="560" y="594" width="12" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="580" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">OPT FRAGMENT</text>

        <line x1="720" y1="600" x2="752" y2="600" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="762" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LIFELINE</text>
      </svg>