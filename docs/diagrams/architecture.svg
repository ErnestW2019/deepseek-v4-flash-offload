<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">deepseek-v4-flash-offload architecture on a single Ascend 950PR</title>
        <desc id="architecture-desc">The vLLM runtime loads deepseek-v4-flash-offload through the vllm.general_plugins entry point; the plugin swaps in an offloading MoE class and intercepts expert weights at load time, driving an expert-offload engine backed by a packed-MXFP4 host bank, an NPU LRU slot cache, and gate-driven prefetch, without modifying vllm_ascend's source.</desc>

        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ arrows (drawn before nodes) ============ -->
        <line x1="480" y1="104" x2="480" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="192" x2="480" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="280" x2="480" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="368" x2="480" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="456" x2="480" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 424,456 V 480 Q 424,488 416,488 H 208 Q 200,488 200,496 V 520"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 536,456 V 480 Q 536,488 544,488 H 752 Q 760,488 760,496 V 520"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="592" y1="340" x2="736" y2="340" stroke="#4f5d75" stroke-width="1"
              stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- ============ arrow labels (mask + text) ============ -->
        <rect x="490" y="202" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="530" y="211" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">OVERRIDES ARCH</text>

        <rect x="636" y="320" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="664" y="329" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">DENSE STAYS</text>

        <!-- ============ nodes ============ -->

        <!-- A · vLLM Runtime (external) -->
        <rect x="368" y="48" width="224" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="48" width="224" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="376" y="54" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="392" y="63" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VLLM</text>
        <text x="480" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">vLLM Runtime</text>
        <text x="480" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scheduler / PagedAttention</text>

        <!-- B · Plugin Entry (backend) -->
        <rect x="368" y="136" width="224" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="136" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="142" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="396" y="151" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PLUGIN</text>
        <text x="480" y="165" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Plugin Entry</text>
        <text x="480" y="181" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">vllm.general_plugins</text>

        <!-- C · Offload Model (backend) -->
        <rect x="368" y="224" width="224" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="224" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="230" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="394" y="239" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
        <text x="480" y="253" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Offload Model</text>
        <text x="480" y="269" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">load_weights tee</text>

        <!-- D · Offload MoE (focal) -->
        <rect x="368" y="312" width="224" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="312" width="224" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="376" y="318" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="390" y="327" fill="rgba(191,69,32,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MOE</text>
        <text x="480" y="341" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Offload MoE</text>
        <text x="480" y="357" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">replaces FusedMoE</text>

        <!-- E · Offload Engine (backend) -->
        <rect x="368" y="400" width="224" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="368" y="400" width="224" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="376" y="406" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="392" y="415" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="480" y="429" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Offload Engine</text>
        <text x="480" y="445" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ExpertOffloadEngine</text>

        <!-- F · Host Bank (focal) -->
        <rect x="84" y="520" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="84" y="520" width="232" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="92" y="526" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="110" y="535" fill="rgba(191,69,32,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="200" y="549" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Host Bank</text>
        <text x="200" y="565" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">packed MXFP4, ~150 GB</text>

        <!-- G · Slot Cache (store) -->
        <rect x="364" y="520" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="364" y="520" width="232" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="372" y="526" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="390" y="535" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
        <text x="480" y="549" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Slot Cache</text>
        <text x="480" y="565" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LRU, hot experts</text>

        <!-- H · Prefetch (backend) -->
        <rect x="644" y="520" width="232" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="644" y="520" width="232" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="652" y="526" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="670" y="535" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ASYNC</text>
        <text x="760" y="549" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Prefetch</text>
        <text x="760" y="565" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">next-layer top-k</text>

        <!-- I · vllm_ascend FusedMoE (external) -->
        <rect x="736" y="312" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="312" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="744" y="318" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="758" y="327" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="820" y="341" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">vllm_ascend</text>
        <text x="820" y="357" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FusedMoE, untouched</text>

        <!-- ============ legend (horizontal strip) ============ -->
        <line x1="40" y1="592" x2="920" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="600" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="140" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">FOCAL</text>

        <rect x="290" y="600" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="310" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">BACKEND</text>

        <rect x="460" y="600" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="480" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">STORE</text>

        <rect x="630" y="600" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="650" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">EXTERNAL</text>

        <line x1="800" y1="606" x2="822" y2="606" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="832" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PASSIVE</text>
      </svg>